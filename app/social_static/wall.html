<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, noimageindex">
  <title>Duvar · Kaderoğlu Ailesi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/social/assets/social.css">
  <link rel="stylesheet" href="/social/assets/wall.css">
</head>
<body class="sx-root wl-body">
  <header class="wl-top">
    <div class="wl-top-in">
      <a class="wl-logo" href="/">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 60V30" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M32 34c-10 0-18-8-18-18 10 0 18 8 18 18zM32 30c0-10 8-18 18-18 0 10-8 18-18 18zM32 22c-5-4-6-11-2-17 5 4 6 11 2 17z" fill="currentColor"/></svg>
        <span>Kaderoğlu</span>
      </a>
      <nav class="wl-nav" id="nav"></nav>
    </div>
  </header>

  <main class="wl-main">
    <div class="wl-feedcol">
      <div class="wl-filter" id="filter" hidden></div>
      <button class="wl-composer" id="composer" type="button">
        <span id="composerAv"></span>
        <span class="wl-composer-text">Aileyle bir an paylaş…</span>
        <span class="wl-composer-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8.5 5l1.5-2h4l1.5 2"/></svg></span>
      </button>
      <div id="feed" class="wl-feed"></div>
      <div id="sentinel" class="wl-sentinel"><div class="sx-spin"></div></div>
    </div>
    <aside class="wl-side" id="side"></aside>
  </main>

  <script src="/social/assets/social.js"></script>
  <script src="/social/assets/wall.js"></script>
</body>
</html>
